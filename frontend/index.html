<!-- frontend/index.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Todo List Hệ Thống</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- MÀN HÌNH AUTH -->
    <div id="auth-container">
        <h1>Todo List</h1>
        <div id="error-msg"></div>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">

        <div class="btn-group">
            <button id="btn-login" class="active-btn">Login</button>
            <button id="btn-signup" class="secondary-btn">Sign Up</button>
        </div>
    </div>

    <!-- MÀN HÌNH TASK -->
    <div id="task-container" style="display: none;">
        <div class="header-task">
            <div class="header-row">
                <h2>TASK</h2>
                <button id="btn-logout" onclick="logout()">Logout</button>
            </div>
            <div class="task-input-group">
                <input type="text" id="task-name" placeholder="Enter a task name..." style="width: 70%;">
                <button onclick="addTask()">Add</button>
            </div>
        </div>

        <div class="body-task" id="task-list">
            <!-- Render tasks ở đây -->
        </div>
    </div>

    <!-- MODAL ASSIGN USER -->
    <div id="assign-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h3>Assign User</h3>
            <input type="text" id="search-user" placeholder="Search email..." onkeyup="searchUsers()">
            <ul id="user-list"></ul>
            <button id="load-more-btn" onclick="loadMoreUsers()" style="display: none;">Show more</button>
        </div>
    </div>

    <!-- MODAL EDIT TASK: 2 lựa chọn -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeEditModal()">&times;</span>

            <!-- View 1: 2 lựa chọn -->
            <div id="edit-menu">
                <h3>Edit Task</h3>
                <button class="edit-option" onclick="editAssigneeOption()">Edit Assignee</button>
                <button class="edit-option" onclick="editTaskNameOption()">Edit Task Name</button>
            </div>

            <!-- View 2: ô sửa tên -->
            <div id="edit-name-view" style="display: none;">
                <h3>Edit Task Name</h3>
                <input type="text" id="edit-task-name-input" placeholder="New task name...">
                <button onclick="saveTaskName()">Save</button>
                <button onclick="closeEditModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
