<!-- frontend/index.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Todo List Hệ Thống</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- MÀN HÌNH AUTH -->
    <div id="auth-container">
        <h1>Todo List</h1>
        <div id="error-msg"></div>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">

        <div class="btn-group">
            <button id="btn-login" class="active-btn">Login</button>
            <button id="btn-signup" class="secondary-btn">Sign Up</button>
        </div>
    </div>

    <!-- MÀN HÌNH TASK -->
    <div id="task-container">
        <div class="header-task">
            <div class="header-row">
                <h2>TASK</h2>
                <button id="btn-logout">Logout</button>
            </div>
            <div class="task-input-group">
                <input type="text" id="task-name" placeholder="Enter a task name...">
                <button id="add-task">Add</button>
            </div>
        </div>

        <div class="body-task" id="task-list">
            <!-- Render tasks ở đây -->
        </div>
    </div>

    <!-- MODAL ASSIGN USER -->
    <div id="assign-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>Assign User</h3>
            <input type="text" id="search-user" placeholder="Search email...">
            <ul id="user-list"></ul>
            <button id="load-more-btn">Show more</button>
        </div>
    </div>

    <!-- MODAL EDIT TASK: 2 lựa chọn -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>

            <!-- View hiển thị 2 lựa chọn -->
            <div id="edit-menu">
                <h3>Edit Task</h3>
                <button class="edit-option">Edit Assignee</button>
                <button class="edit-option">Edit Task Name</button>
            </div>

            <!-- View đổi task name -->
            <div id="edit-name-view">
                <h3>Edit Task Name</h3>
                <input type="text" id="edit-task-name-input" placeholder="New task name...">
                <button>Save</button>
                <button>Cancel</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
